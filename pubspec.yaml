name: emosphere
description: "EmoSphere — share how you feel with the world. A global mood map built on Nostr."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  dart_nostr: ^10.0.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.1.2
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6
  qr_flutter: ^4.1.0
  provider: ^6.1.5
  intl: ^0.20.3
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
