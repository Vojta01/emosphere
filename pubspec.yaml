name: emosphere
description: "EmoSphere — share how you feel with the world. A global mood map built on Nostr."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  dart_nostr: ^10.0.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.1.2
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6
  qr_flutter: ^4.1.0
  provider: ^6.1.5
  intl: ^0.20.3
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

# ---------------------------------------------------------------------------
# Branding codegen. Order matters - flutter_launcher_icons rewrites
# web/icons, web/favicon.png and web/manifest.json, so re-render the web set
# afterwards:
#   cd assets/branding && python3 build_svgs.py && ./render_icons.sh
#   dart run flutter_launcher_icons
#   dart run flutter_native_splash:create
#   cd assets/branding && ./render_icons.sh && python3 verify_assets.py
# ---------------------------------------------------------------------------

# Launcher icon: legacy mipmaps + Android adaptive icon + web/PWA icons.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/emosphere_icon_1024.png"
  # Adaptive icon: brand background + art that already sits inside the
  # 66/108 safe zone, so no extra XML inset is applied.
  adaptive_icon_background: "#0B1020"
  adaptive_icon_foreground: "assets/branding/emosphere_adaptive_foreground_1024.png"
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/branding/emosphere_icon_1024.png"
    background_color: "#0B1020"
    theme_color: "#0B1020"

# Splash screen: dark brand background + logo, portrait and landscape.
flutter_native_splash:
  color: "#0B1020"
  color_dark: "#0B1020"
  image: assets/branding/emosphere_splash_hero_1024.png
  image_dark: assets/branding/emosphere_splash_hero_1024.png
  android: true
  ios: false
  web: false
  fullscreen: true
  android_12:
    color: "#0B1020"
    color_dark: "#0B1020"
    image: assets/branding/emosphere_logo_1024.png
    image_dark: assets/branding/emosphere_logo_1024.png
    icon_background_color: "#0B1020"
    icon_background_color_dark: "#0B1020"
