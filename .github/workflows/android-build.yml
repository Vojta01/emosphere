name: Android APK

# Builds a release APK on GitHub runners.
#
# Deliberately NOT triggered on every push to main: the APK build is heavy
# and the on-push pipeline (CI + Pages deploy) already covers analyze, tests
# and the web build. Use this for release tags and manual runs, then attach
# the artifact to the GitHub Release.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Checksum
        run: |
          cd build/app/outputs/flutter-apk
          sha256sum app-release.apk | tee app-release.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: emosphere-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 30
