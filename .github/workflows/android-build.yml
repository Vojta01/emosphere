name: Android APK

# Builds a release APK on GitHub runners, signed with the stable release
# keystore from the repository secrets (so updates install over previous
# versions and keep the user's identity). The APK is named
# `emosphere-<version>.apk`.
#
# Deliberately NOT triggered on every push to main: the APK build is heavy
# and the on-push pipeline (CI + Pages deploy) already covers analyze, tests
# and the web build. Use this for release tags and manual runs, then attach
# the artifact to the GitHub Release.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/emosphere-release.jks"
          test -s "$RUNNER_TEMP/emosphere-release.jks"

      - name: Build APK (release signed)
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/emosphere-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Rename to emosphere-<version>.apk and checksum
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          cd build/app/outputs/flutter-apk
          cp app-release.apk "emosphere-${VERSION}.apk"
          sha256sum "emosphere-${VERSION}.apk" | tee "emosphere-${VERSION}.apk.sha256"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: emosphere-apk
          path: |
            build/app/outputs/flutter-apk/emosphere-*.apk
            build/app/outputs/flutter-apk/emosphere-*.apk.sha256
          if-no-files-found: error
          retention-days: 30
