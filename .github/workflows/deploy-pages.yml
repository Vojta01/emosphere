name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Manual re-deploy without a new commit.
  workflow_dispatch:

# Least-privilege permissions required by actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; queued runs are not cancelled
# so that every main push ends up published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build web (PWA)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # --pwa-strategy offline-first is deprecated in recent Flutter releases
      # (the hidden flag still works, ServiceWorkerStrategy.offlineFirst is the
      # default anyway). Kept explicit to pin the PWA caching strategy.
      - name: Build web
        run: flutter build web --release --base-href / --pwa-strategy offline-first

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
