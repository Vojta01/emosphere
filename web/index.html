<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided by `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="See how the world feels right now — an anonymous global mood map on Nostr. No accounts, no ads, no server.">

  <!-- Social preview (Telegram, X, Reddit, Discord, …) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="EmoSphere">
  <meta property="og:title" content="EmoSphere — see how the world feels right now">
  <meta property="og:description" content="An anonymous global mood map on Nostr. Share how you feel and watch the world's mood shift in real time.">
  <meta property="og:url" content="https://vojta01.github.io/emosphere/">
  <meta property="og:image" content="https://vojta01.github.io/emosphere/preview.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="en_US">
  <meta property="og:locale:alternate" content="cs_CZ">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="EmoSphere — see how the world feels right now">
  <meta name="twitter:description" content="An anonymous global mood map on Nostr.">
  <meta name="twitter:image" content="https://vojta01.github.io/emosphere/preview.png">

  <!-- Dark premium app: colour the browser chrome and avoid a white flash
       before the Flutter engine paints its first frame. -->
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0B1020">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="EmoSphere">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>EmoSphere</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background-color: #0B1020; }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
